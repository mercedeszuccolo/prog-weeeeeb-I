<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="tareas.css" />
  </head>
  <body>
    <section class="contenedor-general">
      <div class="input-agregar">
        <label for="label-tarea">Agrega una tarea!</label>
        <input type="text" name="tarea" id="input-tarea" />
      </div>
      <div class="lista-tareas" id="lista"></div>
      <div class="botones">
        <button class="agregar" id="boton-agregar">Agregar</button>
        <button class="eliminar" id="boton-eliminar">Eliminar</button>
      </div>
    </section>
    <script src="tareas.js"></script>
  </body>
</html>
